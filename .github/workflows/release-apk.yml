name: Build & Release Driver Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      - 'Beta'
      - 'Apps(personel)'
    paths:
      - 'apps/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor Versi Rilis (misal: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Catatan Rilis (Release Notes)'
        required: false
        default: 'Rilis Otomatis Driver KPM Android APK'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/mobile/package-lock.json'

      - name: ☕ Setup Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        working-directory: ./apps/mobile
        run: npm ci

      - name: ⚡ Build Driver Web Assets (Vite)
        working-directory: ./apps/mobile
        run: npm run build

      - name: 🔄 Sync Capacitor Android Project
        working-directory: ./apps/mobile
        run: npx cap sync android

      - name: 🔑 Set Permissions on Gradle Wrapper
        working-directory: ./apps/mobile/android
        run: chmod +x gradlew

      - name: 🔨 Compile Signed Release APK (Gradle)
        working-directory: ./apps/mobile/android
        run: ./gradlew assembleRelease

      - name: 🏷️ Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Driver KPM ${{ github.event.inputs.version }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Driver KPM ${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "VERSION=v1.0.0" >> $GITHUB_ENV
            echo "RELEASE_NAME=Driver KPM v1.0.0 (Latest)" >> $GITHUB_ENV
          else
            echo "VERSION=v1.0.0-latest" >> $GITHUB_ENV
            echo "RELEASE_NAME=Driver KPM Latest (${{ github.ref_name }})" >> $GITHUB_ENV
          fi

      - name: 📋 Prepare Output APK
        run: |
          mkdir -p release-output
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk release-output/Driver-KPM-${{ env.VERSION }}.apk
          echo "Output APK created at release-output/Driver-KPM-${{ env.VERSION }}.apk"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Driver-KPM-${{ env.VERSION }}-apk
          path: release-output/Driver-KPM-${{ env.VERSION }}.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ## 🚚 Driver KPM Line Feeding Mobile APK (${{ env.VERSION }})

            ### 📦 File Unduhan:
            - **[Unduh Driver-KPM-${{ env.VERSION }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/Driver-KPM-${{ env.VERSION }}.apk)**

            ### 🌟 Fitur Utama:
            - 🛡️ **Signed Release Keystore Resmi** *(Bebas peringatan malicious app Google Play Protect)*
            - 📷 **Native Camera & Instant Image Compressor**
            - 📱 **Universal Android Compatibility** *(Android 5.0 s/d Android 15+)*
            - ⚡ **Google Material Design 3 UI**
            - 📶 **Offline Queue Sync dengan IndexedDB**

            ${{ github.event.inputs.release_notes }}
          files: release-output/Driver-KPM-${{ env.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

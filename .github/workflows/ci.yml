name: CI & Integrity Check

on:
  push:
    branches: [ main, Beta ]
  pull_request:
    branches: [ main, Beta ]

jobs:
  validate:
    name: Build & Integrity Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: 🛡️ Verify Cryptographic Integrity Seal
        run: node scripts/seal_integrity.mjs

      - name: 📦 Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: ⚡ Test Frontend Production Build
        working-directory: ./apps/web
        run: npm run build

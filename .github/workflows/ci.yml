name: CI & Integrity Check

on:
  push:
    branches:
      - main
      - Beta
      - 'Apps(personel)'
  pull_request:
    branches:
      - main
      - Beta
      - 'Apps(personel)'

jobs:
  validate:
    name: Build & Integrity Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/**/package-lock.json'

      - name: 🛡️ Verify Cryptographic Integrity Seal
        run: node scripts/seal_integrity.mjs

      - name: 📦 Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: ⚡ Test Frontend Production Build
        working-directory: ./apps/web
        run: npm run build

      - name: 📦 Install Mobile Dependencies
        working-directory: ./apps/mobile
        run: npm ci

      - name: ⚡ Test Mobile Production Build
        working-directory: ./apps/mobile
        run: npm run build

      - name: 🔍 Run Deep Monorepo Audit Scan
        run: node scripts/deep_scan.mjs



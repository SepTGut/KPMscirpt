name: Markdown Lint

on:
  push:
    branches:
      - main
      - Beta
      - 'Apps(personel)'
  pull_request:
    branches:
      - main
      - Beta
      - 'Apps(personel)'

jobs:
  lint-markdown:
    name: Markdown Linting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📝 Run Markdownlint
        run: npx -y markdownlint-cli README.md

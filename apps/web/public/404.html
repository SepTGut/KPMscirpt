<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a73e8" />
    <meta name="description" content="Halaman yang Anda cari tidak ditemukan pada sistem KPM Line Feeding." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <title>404 - Halaman Tidak Ditemukan | KPM Line Feeding</title>
    <style>
      :root {
        --google-blue: #1a73e8;
        --google-red: #ea4335;
        --google-yellow: #fbbc04;
        --google-green: #34a853;
        --surface: #f8fafc;
        --text: #0f172a;
        --muted: #64748b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--surface);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .google-bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--google-blue) 0%, var(--google-blue) 25%, var(--google-red) 25%, var(--google-red) 50%, var(--google-yellow) 50%, var(--google-yellow) 75%, var(--google-green) 75%, var(--google-green) 100%);
        z-index: 50;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        padding: 48px 36px;
        max-width: 520px;
        width: 100%;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      }
      .badge-404 {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: linear-gradient(135deg, rgba(26, 115, 232, 0.1), rgba(99, 102, 241, 0.15));
        color: var(--google-blue);
        font-size: 32px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 26px;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 10px;
        letter-spacing: -0.5px;
      }
      p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .btn-primary {
        background: linear-gradient(135deg, #1a73e8, #4f46e5);
        color: #ffffff;
        text-decoration: none;
        padding: 14px 24px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 700;
        box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        display: block;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(26, 115, 232, 0.35);
      }
      .btn-secondary {
        background: #f1f5f9;
        color: #334155;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 600;
        display: block;
        transition: background-color 0.15s ease;
      }
      .btn-secondary:hover {
        background: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="google-bar"></div>
    <main class="card">
      <div class="badge-404">🔍</div>
      <h1>404 - Halaman Tidak Ditemukan</h1>
      <p>Halaman atau rute yang Anda tuju tidak tersedia atau telah dipindahkan. Silakan kembali ke menu utama untuk melanjutkan tugas operasional.</p>
      <div class="btn-group">
        <a href="/" class="btn-primary">Kembali ke Dashboard Utama</a>
        <a href="/kpm/personel" class="btn-secondary">Buka Portal Pengemudi (Driver)</a>
      </div>
    </main>
  </body>
</html>

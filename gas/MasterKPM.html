<!--
  MasterKPM.html
  -------------
  Settings dialog for the document-numbering master data. It loads
  current values from Apps Script, lets the user edit them, and saves
  them using google.script.run.
-->
<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

    :root {
      --google-blue: #1a73e8;
      --google-blue-dark: #174ea6;
      --google-green: #188038;
      --google-green-bg: #e6f4ea;
      --slate: #3c4043;
      --slate-light: #747775;
      --bg: #f8fafd;
      --card: #ffffff;
      --border: #e9eef6;
      --border-strong: #dadce0;
      --radius: 16px;
      --font-ui: 'Plus Jakarta Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Plus Jakarta Sans', var(--font-ui);
      --font-mono: 'IBM Plex Mono', SFMono-Regular, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-ui);
      font-size: 12.5px;
      color: var(--slate);
      background: var(--bg);
      margin: 0;
      padding: 0 0 20px 0;
    }

    /* ---------- Google 4-Color Top Bar ---------- */
    .google-bar {
      height: 3.5px;
      background: linear-gradient(90deg, #4285f4 0%, #ea4335 33%, #fbbc04 66%, #34a853 100%);
    }

    .header {
      background: linear-gradient(135deg, #1a73e8, #174ea6);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(26, 115, 232, 0.3);
    }

    .header h1 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
      margin: 0;
    }

    .header p {
      margin: 2px 0 0 0;
      font-size: 11px;
      color: #d2e3fc;
    }

    .content {
      padding: 0 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.08);
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: #202124;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 5px;
    }

    input[type=text],
    input[type=number] {
      width: 100%;
      padding: 9px 12px;
      font-family: var(--font-ui);
      font-size: 12.5px;
      color: #202124;
      background: #fff;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input[type=text]:focus,
    input[type=number]:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, .18);
    }

    .hint {
      font-size: 11px;
      color: var(--slate-light);
      margin-top: 5px;
      line-height: 1.4;
    }

    .hint b {
      color: #1a73e8;
      font-family: var(--font-mono);
      background: #e8f0fe;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #1a73e8, #185abc);
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(26, 115, 232, 0.35);
      transition: all .2s;
    }

    .btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #185abc, #174ea6);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(26, 115, 232, 0.45);
    }

    .btn:disabled {
      background: #bdc1c6;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .status-banner {
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--google-green-bg);
      color: var(--google-green);
      border: 1px solid #ceead6;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      display: none;
    }
  </style>
</head>

<body>
  <!-- Google 4-color top accent bar -->
  <div class="google-bar"></div>

  <div class="header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />
    </svg>
    <div>
      <h1>Pengaturan Master KPM</h1>
      <p>Konfigurasi format penomoran dokumen otomatis</p>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div class="field">
        <label>Format Template KPM</label>
        <input type="text" id="template" placeholder="{no}/REKA/KPM/{month}/{year}">
        <div class="hint">Placeholder: <b>{no}</b> (nomor), <b>{month}</b> (Romawi: I-XII), <b>{monthNum}</b> (angka: 01-12), <b>{year}</b> (tahun).</div>
      </div>

      <div class="field">
        <label>Format Template No Lampiran KPM</label>
        <input type="text" id="lampiranTemplate" placeholder="{no}/KPM-LAMP/{month}/{year}">
        <div class="hint">Placeholder: <b>{no}</b> (nomor), <b>{month}</b> (Romawi: I-XII), <b>{monthNum}</b> (angka: 01-12), <b>{year}</b> (tahun).</div>
      </div>

      <div class="field">
        <label>Nomor Urut Mulai (Start No)</label>
        <input type="number" id="startNo" placeholder="1">
      </div>
    </div>

    <button class="btn" onclick="saveSettings()" id="saveBtn">Simpan Pengaturan</button>
    <div id="status" class="status-banner">✓ Pengaturan berhasil disimpan!</div>
  </div>

  <script>
    google.script.run.withSuccessHandler(function (settings) {
      document.getElementById('template').value = settings.template || '';
      document.getElementById('lampiranTemplate').value = settings.lampiranTemplate || '';
      document.getElementById('startNo').value = settings.startNo || '1';
    }).getMasterSettings();

    function saveSettings() {
      var btn = document.getElementById('saveBtn');
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      var data = {
        template: document.getElementById('template').value,
        lampiranTemplate: document.getElementById('lampiranTemplate').value,
        startNo: document.getElementById('startNo').value
      };

      google.script.run.withSuccessHandler(function () {
        var status = document.getElementById('status');
        status.style.display = 'block';
        btn.innerText = "Simpan Pengaturan";
        btn.disabled = false;
        setTimeout(function () { google.script.host.close(); }, 1200);
      }).saveMasterSettings(data);
    }
  </script>
</body>

</html>

<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafd;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
      position: relative;
      color: #202124;
    }

    /* Google 4-color ambient light glow */
    body::before {
      content: '';
      position: fixed;
      top: -80px;
      left: -80px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(66, 133, 244, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -80px;
      right: -80px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(52, 168, 83, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 28px;
      border: 1px solid #e9eef6;
      padding: 28px 26px 24px;
      text-align: center;
      position: relative;
      box-shadow:
        0 1px 3px 1px rgba(60, 64, 67, 0.12),
        0 8px 24px -4px rgba(60, 64, 67, 0.1);
      animation: cardIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Google 4-color accent top bar */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 4px;
      background: linear-gradient(90deg, #4285f4 0%, #ea4335 33%, #fbbc04 66%, #34a853 100%);
      border-radius: 0 0 4px 4px;
    }

    /* ── Logo Container ── */
    .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px auto 12px;
      min-height: 95px;
    }

    .logo-glow-backdrop {
      position: absolute;
      width: 130px;
      height: 95px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(66, 133, 244, 0.15) 0%, rgba(52, 168, 83, 0.08) 50%, transparent 75%);
      filter: blur(12px);
      animation: pulseGlow 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.08); }
    }

    .inst-logo {
      position: relative;
      max-width: 200px;
      max-height: 90px;
      width: auto;
      height: auto;
      object-fit: contain;
      background: transparent;
      filter: drop-shadow(0 4px 8px rgba(60, 64, 67, 0.15));
      transition: transform 0.3s ease;
      z-index: 2;
    }

    .inst-logo:hover {
      transform: scale(1.04);
    }

    /* ── Headings ── */
    .institution-name {
      font-size: 20px;
      font-weight: 800;
      color: #202124;
      letter-spacing: -0.2px;
      margin-bottom: 6px;
    }

    .faculty-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e8f0fe;
      border: 1px solid #d2e3fc;
      color: #1a73e8;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      padding: 5px 16px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }

    .author-section {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .author-name {
      font-weight: 700;
      color: #1a73e8;
      letter-spacing: 0.2px;
    }

    .divider {
      height: 1px;
      background: #e9eef6;
      margin-bottom: 16px;
    }

    /* ── Info Grid (M3 Light Cards) ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .info-card {
      background: #f8fafd;
      border: 1px solid #e9eef6;
      border-radius: 18px;
      padding: 12px 6px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .info-card:hover {
      background: #e8f0fe;
      border-color: #d2e3fc;
      transform: translateY(-2px);
    }

    .info-icon {
      font-size: 20px;
      margin-bottom: 4px;
      display: block;
    }

    .info-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #747775;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 12.5px;
      font-weight: 700;
      color: #202124;
      line-height: 1.3;
    }

    .copyright {
      font-size: 11px;
      color: #747775;
      margin-bottom: 16px;
      letter-spacing: 0.2px;
    }

    /* ── Google M3 Pill Close Button ── */
    .btn-close {
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, #1a73e8, #185abc);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(26, 115, 232, 0.35);
    }

    .btn-close:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.45);
      background: linear-gradient(135deg, #185abc, #174ea6);
    }

    .btn-close:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Transparent Logo Container -->
    <div class="logo-container">
      <div class="logo-glow-backdrop"></div>
      <img class="inst-logo" src="<?!= info.logo ?>" alt="Logo Instansi">
    </div>

    <!-- Institution Name -->
    <div class="institution-name"><?= info.institution ?></div>
    
    <!-- Faculty / Jurusan Badge -->
    <div>
      <div class="faculty-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span><?= info.faculty ?></span>
      </div>
    </div>

    <div class="author-section">
      <span>Pengembang:</span>
      <span class="author-name"><?= info.author ?></span>
    </div>

    <div class="divider"></div>

    <!-- System Info Grid -->
    <div class="info-grid">
      <div class="info-card">
        <div class="info-icon" style="display: flex; justify-content: center; align-items: center; margin-bottom: 6px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
        <div class="info-label">Aplikasi</div>
        <div class="info-value"><?= info.appName ?></div>
      </div>
      <div class="info-card">
        <div class="info-icon" style="display: flex; justify-content: center; align-items: center; margin-bottom: 6px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#188038" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        </div>
        <div class="info-label">Versi</div>
        <div class="info-value">v<?= info.version ?></div>
      </div>
      <div class="info-card">
        <div class="info-icon" style="display: flex; justify-content: center; align-items: center; margin-bottom: 6px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d93025" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="info-label">Tahun</div>
        <div class="info-value"><?= info.year ?></div>
      </div>
    </div>

    <div class="copyright">© <?= info.year ?> <?= info.author ?> · <?= info.institution ?></div>

    <button class="btn-close" onclick="google.script.host.close()" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span>Tutup</span>
    </button>
  </div>

</body>
</html>

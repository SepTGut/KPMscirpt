<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #f8fafc;
      color: #1e293b;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      padding: 28px 24px;
      width: 100%;
      border: 1px solid #e2e8f0;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #0b57d0, #38bdf8);
    }
    .logo-container {
      width: 90px;
      height: 90px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #eff6ff;
      border: 3px solid #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(11, 87, 208, 0.15);
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h2 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .author-badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .institution {
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 16px;
    }
    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 16px 0;
    }
    .details {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
      text-align: left;
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      margin-bottom: 18px;
    }
    .details-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .details-row:last-child {
      margin-bottom: 0;
    }
    .details-label {
      font-weight: 600;
      color: #475569;
    }
    .btn-close {
      background: #0f172a;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-close:hover {
      background: #1e293b;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <img src="<?!= info.logo ?>" alt="Logo">
    </div>

    <h2><?= info.author ?></h2>
    <div class="author-badge">Pengembang Sistem</div>
    
    <div class="institution">🏫 <?= info.institution ?></div>

    <div class="details">
      <div class="details-row">
        <span class="details-label">Aplikasi:</span>
        <span><?= info.appName ?></span>
      </div>
      <div class="details-row">
        <span class="details-label">Versi:</span>
        <span>v<?= info.version ?></span>
      </div>
      <div class="details-row">
        <span class="details-label">Tahun:</span>
        <span><?= info.year ?></span>
      </div>
    </div>

    <button class="btn-close" onclick="google.script.host.close()">Tutup</button>
  </div>

</body>
</html>

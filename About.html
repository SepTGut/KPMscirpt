<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #060d24 0%, #0a1a3e 50%, #071428 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient glow orbs */
    body::before {
      content: '';
      position: fixed;
      top: -80px;
      left: -80px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -80px;
      right: -80px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(6,182,212,0.14) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 32px 28px 28px;
      text-align: center;
      position: relative;
      box-shadow:
        0 25px 50px rgba(0,0,0,0.5),
        0 0 0 1px rgba(59,130,246,0.15) inset,
        0 1px 0 rgba(255,255,255,0.08) inset;
      animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top accent line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #3b82f6, #06b6d4, transparent);
      border-radius: 0 0 2px 2px;
    }

    /* ── Logo ── */
    .logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
    }
    .logo-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(59,130,246,0.8),
        rgba(6,182,212,0.8),
        rgba(99,102,241,0.8),
        rgba(59,130,246,0.8)
      );
      animation: spin 4s linear infinite;
      -webkit-mask: radial-gradient(circle, transparent 42px, black 43px);
      mask: radial-gradient(circle, transparent 42px, black 43px);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .logo-glow {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, transparent 70%);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.08); }
    }
    .logo-inner {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, #0f2057, #1a3a7c);
      border: 3px solid rgba(59,130,246,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .logo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Name ── */
    .author-name {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      text-shadow: 0 0 24px rgba(59,130,246,0.4);
    }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(6,182,212,0.15));
      border: 1px solid rgba(59,130,246,0.35);
      color: #7dd3fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    .badge::before { content: '✦'; font-size: 9px; opacity: 0.7; }

    /* ── Institution ── */
    .institution {
      font-size: 13px;
      font-weight: 500;
      color: rgba(148,163,184,0.9);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .institution-icon {
      font-size: 14px;
      opacity: 0.8;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      margin-bottom: 20px;
    }

    /* ── Info Grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .info-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 8px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .info-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,0.4), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .info-card:hover {
      background: rgba(59,130,246,0.08);
      border-color: rgba(59,130,246,0.25);
      transform: translateY(-2px);
    }
    .info-card:hover::before { opacity: 1; }
    .info-icon {
      font-size: 18px;
      margin-bottom: 6px;
      display: block;
    }
    .info-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(100,116,139,1);
      margin-bottom: 4px;
    }
    .info-value {
      font-size: 12px;
      font-weight: 700;
      color: rgba(226,232,240,0.95);
      line-height: 1.3;
    }

    /* ── Footer / Copyright ── */
    .copyright {
      font-size: 10px;
      color: rgba(100,116,139,0.7);
      margin-bottom: 20px;
      letter-spacing: 0.3px;
    }

    /* ── Close Button ── */
    .btn-close {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1d4ed8, #0891b2);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(29,78,216,0.4);
    }
    .btn-close::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
      pointer-events: none;
    }
    .btn-close:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(29,78,216,0.55);
      background: linear-gradient(135deg, #2563eb, #0e7490);
    }
    .btn-close:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Spinning ring logo -->
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <div class="logo-ring"></div>
      <div class="logo-inner">
        <img src="<?!= info.logo ?>" alt="Logo">
      </div>
    </div>

    <div class="author-name"><?= info.author ?></div>
    <div class="badge">Pengembang Sistem</div>

    <div class="institution">
      <span class="institution-icon">🏫</span>
      <?= info.institution ?>
    </div>

    <div class="divider"></div>

    <div class="info-grid">
      <div class="info-card">
        <span class="info-icon">⚙️</span>
        <div class="info-label">Aplikasi</div>
        <div class="info-value"><?= info.appName ?></div>
      </div>
      <div class="info-card">
        <span class="info-icon">🏷️</span>
        <div class="info-label">Versi</div>
        <div class="info-value">v<?= info.version ?></div>
      </div>
      <div class="info-card">
        <span class="info-icon">📅</span>
        <div class="info-label">Tahun</div>
        <div class="info-value"><?= info.year ?></div>
      </div>
    </div>

    <div class="copyright">© <?= info.year ?> <?= info.author ?> · <?= info.institution ?></div>

    <button class="btn-close" onclick="google.script.host.close()">✕&nbsp; Tutup</button>
  </div>

</body>
</html>

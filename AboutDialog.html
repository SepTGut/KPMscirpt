<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #050b1d 0%, #0a193c 50%, #061226 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
      position: relative;
      color: #e2e8f0;
    }

    /* Ambient background glow orbs */
    body::before {
      content: '';
      position: fixed;
      top: -100px;
      left: -100px;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px;
      right: -100px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 28px 28px 24px;
      text-align: center;
      position: relative;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(59, 130, 246, 0.18) inset,
        0 1px 0 rgba(255, 255, 255, 0.12) inset;
      animation: cardIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top accent gradient bar */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #3b82f6, #06b6d4, #6366f1, transparent);
      border-radius: 0 0 3px 3px;
    }

    /* ── Logo Container (Transparent PNG Emblem) ── */
    .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      min-height: 105px;
    }

    .logo-glow-backdrop {
      position: absolute;
      width: 130px;
      height: 105px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.28) 0%, rgba(6, 182, 212, 0.12) 50%, transparent 75%);
      filter: blur(12px);
      animation: pulseGlow 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.12); }
    }

    .inst-logo {
      position: relative;
      max-width: 220px;
      max-height: 100px;
      width: auto;
      height: auto;
      object-fit: contain;
      background: transparent;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 14px rgba(59, 130, 246, 0.4));
      transition: transform 0.3s ease;
      z-index: 2;
    }

    .inst-logo:hover {
      transform: scale(1.05);
    }

    /* ── Institution & Faculty Headings ── */
    .institution-name {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
      margin-bottom: 6px;
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.45);
    }

    .faculty-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(6, 182, 212, 0.18));
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: #7dd3fc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.2);
    }

    .author-section {
      font-size: 13px;
      color: rgba(203, 213, 225, 0.95);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .author-name {
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 0.2px;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      margin-bottom: 16px;
    }

    /* ── Info Grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 6px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .info-card:hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.35);
      transform: translateY(-2px);
    }

    .info-icon {
      font-size: 20px;
      margin-bottom: 4px;
      display: block;
    }

    .info-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 12px;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.3;
    }

    /* ── Copyright & Signature ── */
    .copyright {
      font-size: 10px;
      color: rgba(148, 163, 184, 0.8);
      margin-bottom: 16px;
      letter-spacing: 0.2px;
    }

    /* ── Close Button ── */
    .btn-close {
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #1d4ed8, #0891b2);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
      box-shadow: 0 6px 22px rgba(29, 78, 216, 0.45);
    }

    .btn-close::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), transparent);
      pointer-events: none;
    }

    .btn-close:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(29, 78, 216, 0.6);
      background: linear-gradient(135deg, #2563eb, #0e7490);
    }

    .btn-close:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Transparent Logo Container -->
    <div class="logo-container">
      <div class="logo-glow-backdrop"></div>
      <img class="inst-logo" src="<?!= info.logo ?>" alt="Logo Instansi">
    </div>

    <!-- Institution Name -->
    <div class="institution-name"><?= info.institution ?></div>
    
    <!-- Faculty / Jurusan Badge -->
    <div>
      <div class="faculty-badge">
        <span>⚡</span>
        <span><?= info.faculty ?></span>
      </div>
    </div>

    <div class="author-section">
      <span>Pengembang:</span>
      <span class="author-name"><?= info.author ?></span>
    </div>

    <div class="divider"></div>

    <!-- System Info Grid -->
    <div class="info-grid">
      <div class="info-card">
        <span class="info-icon">⚙️</span>
        <div class="info-label">Aplikasi</div>
        <div class="info-value"><?= info.appName ?></div>
      </div>
      <div class="info-card">
        <span class="info-icon">🏷️</span>
        <div class="info-label">Versi</div>
        <div class="info-value">v<?= info.version ?></div>
      </div>
      <div class="info-card">
        <span class="info-icon">📅</span>
        <div class="info-label">Tahun</div>
        <div class="info-value"><?= info.year ?></div>
      </div>
    </div>

    <div class="copyright">© <?= info.year ?> <?= info.author ?> · <?= info.institution ?></div>

    <button class="btn-close" onclick="google.script.host.close()">✕&nbsp; Tutup</button>
  </div>

</body>
</html>

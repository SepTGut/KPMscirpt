<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #131314 0%, #1e1f20 50%, #131314 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
      position: relative;
      color: #e8eaed;
    }

    /* Google 4-color ambient glow orbs */
    body::before {
      content: '';
      position: fixed;
      top: -80px;
      left: -80px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(66, 133, 244, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -80px;
      right: -80px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(52, 168, 83, 0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(30, 31, 32, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 28px 26px 24px;
      text-align: center;
      position: relative;
      box-shadow:
        0 24px 48px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(66, 133, 244, 0.2) inset,
        0 1px 0 rgba(255, 255, 255, 0.12) inset;
      animation: cardIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Google 4-color accent top bar */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 3.5px;
      background: linear-gradient(90deg, #4285f4 0%, #ea4335 33%, #fbbc04 66%, #34a853 100%);
      border-radius: 0 0 4px 4px;
    }

    /* ── Logo Container ── */
    .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      min-height: 100px;
    }

    .logo-glow-backdrop {
      position: absolute;
      width: 130px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(66, 133, 244, 0.3) 0%, rgba(52, 168, 83, 0.15) 50%, transparent 75%);
      filter: blur(14px);
      animation: pulseGlow 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.1); }
    }

    .inst-logo {
      position: relative;
      max-width: 200px;
      max-height: 95px;
      width: auto;
      height: auto;
      object-fit: contain;
      background: transparent;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 14px rgba(66, 133, 244, 0.4));
      transition: transform 0.3s ease;
      z-index: 2;
    }

    .inst-logo:hover {
      transform: scale(1.04);
    }

    /* ── Headings ── */
    .institution-name {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
      margin-bottom: 6px;
      text-shadow: 0 0 20px rgba(66, 133, 244, 0.4);
    }

    .faculty-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(66, 133, 244, 0.18);
      border: 1px solid rgba(66, 133, 244, 0.4);
      color: #8ab4f8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(66, 133, 244, 0.15);
    }

    .author-section {
      font-size: 13px;
      color: #c4c7c5;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .author-name {
      font-weight: 700;
      color: #8ab4f8;
      letter-spacing: 0.2px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
      margin-bottom: 16px;
    }

    /* ── Info Grid (M3 Cards) ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 6px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .info-card:hover {
      background: rgba(66, 133, 244, 0.12);
      border-color: rgba(66, 133, 244, 0.4);
      transform: translateY(-2px);
    }

    .info-icon {
      font-size: 20px;
      margin-bottom: 4px;
      display: block;
    }

    .info-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #9aa0a6;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 12px;
      font-weight: 700;
      color: #f8fafd;
      line-height: 1.3;
    }

    .copyright {
      font-size: 10px;
      color: #8e918f;
      margin-bottom: 16px;
      letter-spacing: 0.2px;
    }

    /* ── Google M3 Pill Close Button ── */
    .btn-close {
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, #1a73e8, #185abc);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(26, 115, 232, 0.4);
    }

    .btn-close:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(26, 115, 232, 0.55);
      background: linear-gradient(135deg, #1967d2, #174ea6);
    }

    .btn-close:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Transparent Logo Container -->
    <div class="logo-container">
      <div class="logo-glow-backdrop"></div>
      <img class="inst-logo" src="<?!= info.logo ?>" alt="Logo Instansi">
    </div>

    <!-- Institution Name -->
    <div class="institution-name"><?= info.institution ?></div>
    
    <!-- Faculty / Jurusan Badge -->
    <div>
      <div class="faculty-badge">
        <span>⚡</span>
        <span><?= info.faculty ?></span>
      </div>
    </div>

    <div class="author-section">
      <span>Pengembang:</span>
      <span class="author-name"><?= info.author ?></span>
    </div>

    <div class="divider"></div>

    <!-- System Info Grid -->
    <div class="info-grid">
      <div class="info-card">
        <span class="info-icon">⚙️</span>
        <div class="info-label">Aplikasi</div>
        <div class="info-value"><?= info.appName ?></div>
      </div>
      <div class="info-card">
        <span class="info-icon">🏷️</span>
        <div class="info-label">Versi</div>
        <div class="info-value">v<?= info.version ?></div>
      </div>
      <div class="info-card">
        <span class="info-icon">📅</span>
        <div class="info-label">Tahun</div>
        <div class="info-value"><?= info.year ?></div>
      </div>
    </div>

    <div class="copyright">© <?= info.year ?> <?= info.author ?> · <?= info.institution ?></div>

    <button class="btn-close" onclick="google.script.host.close()">✕&nbsp; Tutup</button>
  </div>

</body>
</html>

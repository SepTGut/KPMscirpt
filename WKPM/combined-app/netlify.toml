[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/kpm/personel"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kpm/personel/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kpm"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kpm/*"
  to = "/index.html"
  status = 200

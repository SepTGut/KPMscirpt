[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."api"]
  timeout = 26

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/kpm/personel"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kpm/personel/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kpm"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kpm/*"
  to = "/index.html"
  status = 200

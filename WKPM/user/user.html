<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Line Feeding - Ekspedisi (Legacy - Nonaktif)</title>
    <link rel="stylesheet" href="user.css">
  </head>
  <body>
    <div class="container">
      <div style="background:#fff3cd; color:#856404; border:1px solid #ffeeba; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-weight:600; font-size:13px; text-align:center;">
        ⚠️ <strong>Portal Web Driver Lama (Legacy) Dinonaktifkan:</strong> Silakan gunakan Portal Personel Driver Terpadu di <code>/kpm/personel</code>.
      </div>
      <h2>Sistem Line Feeding</h2>
      <p class="subtitle" id="statusTeks">Portal legacy dinonaktifkan. Silakan gunakan link portal resmi.</p>

      <form id="updateForm" name="updateForm">
        <label for="nomorKPM">Nomor KPM (Pilih dari daftar):</label>
        <div class="kpm-group">
          <select id="nomorKPM" name="nomorKPM" disabled required>
            <option value="">-- Portal Dinonaktifkan --</option>
          </select>
          <button type="button" id="btnRefreshData" class="btn-refresh" disabled>🔄 Perbarui</button>
        </div>

        <label for="namaProyek">Nama Proyek:</label>
        <input type="text" id="namaProyek" name="namaProyek" class="input-terkunci" readonly disabled required>
        
        <label>Daftar Barang Bawaan (Cross-check):</label>
        <div id="wadahListBarang" class="box-barang">
          <p>Portal web lama telah dinonaktifkan.</p>
        </div>

        <label>Update Status Ekspedisi:</label>
        <div class="radio-group">
          <label><input type="radio" name="statusKPM" value="Berangkat" class="radio-status" disabled required> Berangkat</label>
          <label><input type="radio" name="statusKPM" value="Tiba" class="radio-status" disabled required> Tiba</label>
        </div>

        <div id="wadahFoto">
          <label id="labelFoto" for="inputFoto" style="margin-top: 0;">📷 Unggah Bukti Foto (Wajib):</label>
          <input type="file" id="inputFoto" accept="image/*" capture="environment" disabled>
          <div id="statusKompresi">Memproses ukuran foto...</div>
          <input type="hidden" id="fotoData" name="fotoData">
        </div>

        <label for="lokasiWorkshop">Lokasi Workshop (Rute):</label>
        <input type="text" id="lokasiWorkshop" name="lokasiWorkshop" class="input-terkunci" readonly disabled required>

        <label for="namaPIC">Nama Petugas / PIC:</label>
        <input type="text" id="namaPIC" name="namaPIC" class="input-terkunci" readonly disabled required>

        <button type="submit" id="btnSubmitUpd" class="submit-btn" disabled style="opacity:0.6; cursor:not-allowed;">Simpan ke Database (Nonaktif)</button>
      </form>
      <div id="pesanUpdate"></div>
    </div>

    <script src="config.js"></script>
    <script src="user.js" defer></script>
  </body>
</html>
